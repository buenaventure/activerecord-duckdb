name: Tests
on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    # Rails main is the upcoming Rails 8.2. Its failures are an early warning, not a blocker.
    continue-on-error: ${{ matrix.ruby == 'head' || matrix.rails == 'main' }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3.12", "3.4.10", "4.0.6", "head"]
        rails: ["8.0", "8.1", "main"]
    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails }}.gemfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Ruby environment
        uses: ./.github/actions/setup-ruby
        with:
          ruby_version: ${{ matrix.ruby }}

      - name: Run tests
        shell: sh
        run: bundle exec rspec spec

  # DuckDB 2.0 is not released yet. This job runs the suite against its nightly preview build, so
  # breaking changes show up before the release does. A failure here is an early warning and does
  # not fail the build. Once 2.0 is released, move it into the matrix above as a tag (v2.0.0).
  duckdb-preview:
    name: tests (DuckDB 2.0 preview)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      BUNDLE_GEMFILE: gemfiles/rails_8.1.gemfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Ruby environment
        uses: ./.github/actions/setup-ruby
        with:
          ruby_version: "3.4.10"
          duckdb_version: v2.0-cyanoptera

      - name: Run tests
        shell: sh
        run: bundle exec rspec spec
