name: Setup Ruby
description: Setup Ruby environment and install dependencies

inputs:
  ruby_version:
    description: The version of Ruby to install
    default: "3.4.2"
    required: false

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: sh
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential
        sudo apt-get install -y --no-install-recommends cmake git wget

    - name: Install DuckDB
      shell: sh
      env:
        DUCKDB_VERSION: v1.5.5
      run: |
        base="https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}"

        # spec/support/quack_server.rb serves a Quack endpoint by shelling out to this binary,
        # which is something libduckdb cannot do.
        wget -q "${base}/duckdb_cli-linux-amd64.zip"
        unzip -q duckdb_cli-linux-amd64.zip -d duckdb-cli
        sudo install -m 755 duckdb-cli/duckdb /usr/local/bin/duckdb

        # The duckdb gem builds its native extension against these.
        wget -q "${base}/libduckdb-linux-amd64.zip"
        unzip -q libduckdb-linux-amd64.zip -d libduckdb
        sudo mv libduckdb/duckdb.* /usr/local/include/
        sudo mv libduckdb/libduckdb.so /usr/local/lib/
        sudo ldconfig /usr/local/lib

        rm -rf duckdb-cli duckdb_cli-linux-amd64.zip libduckdb libduckdb-linux-amd64.zip
        duckdb --version

    # Setup ruby and bundle install
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby_version }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
